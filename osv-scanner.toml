# OSV-Scanner configuration for resq-software/programs.
#
# Each [[IgnoredVulns]] block carries a rationale for why the advisory cannot
# be fixed in this workspace today. Revisit on any Solana / Anchor major bump.
#
# Format: https://google.github.io/osv-scanner/configuration/
# Note: OSV-Scanner v2 expects PascalCase keys (IgnoredVulns); snake_case is rejected.

# ── Unmaintained-crate advisories (informational, no known exploit) ──────────

[[IgnoredVulns]]
id = "RUSTSEC-2025-0141"
# bincode 1.3.3 is unmaintained; bincode 2.x is available but breaks the
# Anchor 1.0.0-rc.2 serialization API. Blocked on Anchor upstream migration.
reason = "bincode 1.x transitive via anchor-lang; await upstream Anchor bump to bincode 2.x"

[[IgnoredVulns]]
id = "RUSTSEC-2024-0388"
# derivative is unmaintained. Transitive via anchor-lang's macro machinery.
reason = "derivative 2.2.0 transitive via anchor-lang; await upstream migration to derive-more or similar"

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
# paste is unmaintained. Transitive via anchor-lang macros.
reason = "paste 1.0.15 transitive via anchor-lang macros; await upstream migration"

[[IgnoredVulns]]
id = "RUSTSEC-2025-0161"
# libsecp256k1 0.6.0 is effectively frozen; Solana pins this version.
reason = "libsecp256k1 0.6.0 transitive via solana-* crates; fix requires upstream Solana bump"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0173"
# proc-macro-error2 2.0.1 is unmaintained (author archived the crate). It is a
# build-time-only proc-macro pulled transitively via aquamarine (doc diagrams)
# -> solana-runtime -> solana-program-test, which is a dev-dependency. No fixed
# version exists; the advisory recommends migrating away, which is upstream work.
reason = "proc-macro-error2 2.0.1 unmaintained; build-time dev-dep via aquamarine -> solana-runtime -> solana-program-test; no fix available, await upstream Solana migration"

# ── Old dalek / rand pins (transitive via Solana; on-chain BPF unaffected) ───

[[IgnoredVulns]]
id = "RUSTSEC-2024-0344"
# curve25519-dalek 3.2.0 has a timing side channel in Scalar::from_canonical_bytes.
# Pinned by solana-zk-token-sdk and older solana-program versions which we pull
# transitively. On-chain BPF code does not execute this crate (programs verify
# via syscalls, not userspace dalek). Risk is confined to host-side tests.
reason = "curve25519-dalek 3.2.0 transitive via solana-zk-token-sdk; on-chain BPF unaffected; await upstream Solana bump to dalek 4.x across the stack"

[[IgnoredVulns]]
id = "RUSTSEC-2022-0093"
# ed25519-dalek 1.0.1 has a signature-oracle vulnerability in specific API misuse
# patterns. Programs in this workspace never call ed25519-dalek directly; it comes
# in via vendored solana-program-test (a dev-dependency only).
reason = "ed25519-dalek 1.0.1 transitive via vendored solana-program-test (dev-dep only); on-chain programs do not call dalek directly"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0097"
# rand 0.7.3 is unsound when rand::rng() is called with a custom logger installed.
# We pin rand 0.7.3 only transitively via old solana-* deps. No workspace code uses
# custom loggers with rand; the 0.8.x and 0.9.x pins are already on fixed versions.
reason = "rand 0.7.3 transitive via solana-* deps; fixed versions (0.8.6, 0.9.3) already pinned for first-order users; no custom-logger code paths"

# The vendored solana-program-test crate is a [patch.crates-io] path
# dependency: Cargo resolves it through THIS root Cargo.lock, never the
# nested vendor/solana-program-test/Cargo.lock. That nested lockfile was
# therefore unused build-wise but caused osv-scanner to scan it as a
# separate project and report false positives — so it (and its companion
# osv-scanner.toml) were removed, matching the sibling vendored crates
# vendor/solana-invoke and vendor/solana-keypair, which ship no lockfile.

# ── Version-scoped package exceptions ───────────────────────────────────────
#
# Prefer PackageOverrides over IgnoredVulns when only ONE version of a package
# is unfixable. IgnoredVulns matches by advisory ID alone, so it would suppress
# the advisory across the whole scan — including a future regression on a
# non-dev path. This form pins the exception to the exact version.

[[PackageOverrides]]
name = "memmap2"
version = "0.5.10"
ecosystem = "crates.io"
ignore = true
# Reached only through the vendored solana-program-test dev-dependency:
# solana-genesis-config 3.0.0 -> agave-snapshots -> solana-runtime ->
# solana-banks-server -> solana-program-test. That chain pins the 0.5.x line,
# so `cargo update` cannot lift it to 0.9.11 without an upstream Solana bump.
#
# The first-order path is NOT excepted — memmap2 0.9.10 was updated to the
# fixed 0.9.11 in this same change, and because this override is version-scoped
# RUSTSEC-2026-0186 still fires on any other memmap2 version. Drop this block
# as soon as Solana moves off memmap2 0.5.
reason = "memmap2 0.5.10 only, transitive via vendored solana-program-test (dev-dep); 0.9.x path already updated to the fixed 0.9.11; 0.5.x pin requires upstream Solana bump"

# ── im test-framework family + lru (dev-only via solana-program-test) ─────────
#
# im (persistent data structures) and its helper crates bitmaps + sized-chunks,
# plus lru, are all reached ONLY through the dev-only chain
#   solana-runtime / solana-tpu-client-next -> solana-send-transaction-service
#   -> solana-banks-server -> solana-program-test  ([dev-dependencies])
# `cargo tree -e normal -i solana-runtime` is empty, so none of these are
# compiled into the on-chain BPF programs — exposure is host-side test only.
# im/bitmaps/sized-chunks are unmaintained with no fixed releases; lru has a fix
# (0.18.2) but solana-tpu-client-next pins `lru = "^0.7.7"` so `cargo update -p
# lru --precise 0.18.2` fails. Version-scoped (per the note above) so a future
# regression on a non-dev path still fires. Drop each as Solana's test stack
# moves off im / bumps lru.

[[PackageOverrides]]
name = "im"
version = "15.1.0"
ecosystem = "crates.io"
ignore = true
# Covers RUSTSEC-2023-0126 and RUSTSEC-2026-0248.
reason = "im 15.1.0 only, unmaintained (no fixed release); dev-only via solana-program-test; never in on-chain BPF; await upstream Solana migration off im"

[[PackageOverrides]]
name = "bitmaps"
version = "2.1.0"
ecosystem = "crates.io"
ignore = true
# Helper crate of im. Covers RUSTSEC-2026-0247.
reason = "bitmaps 2.1.0 only, unmaintained (no fixed release); transitive via im (dev-only, solana-program-test); never in on-chain BPF"

[[PackageOverrides]]
name = "sized-chunks"
version = "0.6.5"
ecosystem = "crates.io"
ignore = true
# Helper crate of im. Covers RUSTSEC-2026-0251 and RUSTSEC-2026-0255.
reason = "sized-chunks 0.6.5 only, unmaintained (no fixed release); transitive via im (dev-only, solana-program-test); never in on-chain BPF"

[[PackageOverrides]]
name = "lru"
version = "0.7.8"
ecosystem = "crates.io"
ignore = true
# Covers RUSTSEC-2026-0253. Fix (0.18.2) blocked by solana-tpu-client-next's
# `lru = "^0.7.7"` pin.
reason = "lru 0.7.8 only: fixed in 0.18.2 but solana-tpu-client-next pins ^0.7.7 (semver-incompatible); dev-only via solana-program-test; never in on-chain BPF; await upstream Solana bump"
