[workspace]
resolver = "2"
members = [
  "resq-delivery",
  "resq-airspace",
  "resq-gating",
]

[workspace.lints.rust]
unsafe_code = "warn"
# Anchor's `#[program]` / `#[derive(Accounts)]` macros probe cfg values
# (`anchor-debug`, `custom-heap`, `custom-panic`, `target_os = "solana"`)
# that are never declared in any crate's `[features]`/`[target]` table.
# These are macro-generated artifacts, not authored code, so we allow the
# lint workspace-wide rather than hand-registering every macro-internal cfg.
unexpected_cfgs = "allow"
# anchor-lang's `#[derive(Accounts)]` expansion emits an internal reference
# to its own deprecated `deprecated_account_info_usage` shim whenever a
# handler still takes `AccountInfo` directly (resq-gating does, deliberately,
# as part of its CWE-294 security fix). This is macro-generated, not
# user-authored deprecated-API usage.
deprecated = "allow"

[workspace.lints.clippy]
# `#[program]` (Anchor's instruction-dispatch macro) expands to a match with
# an unreachable arm that clippy flags as a diverging sub-expression. This is
# inherent to the macro's generated dispatcher, not authored control flow.
diverging_sub_expression = "allow"

[workspace.dependencies]
anchor-lang = { version = "1.0.0-rc.4", features = ["init-if-needed"] }
anchor-client = "1.0.0-rc.2"
solana-account = "3.2.0"
solana-account-info = "3.1.1"
solana-instruction = "3.4.0"
solana-keypair = "3.1.2"
solana-program-entrypoint = "3.1.1"
solana-program-test = { version = "3.1.10", features = ["agave-unstable-api"] }
solana-pubkey = "4.2.0"
solana-sdk = "4.0.1"
solana-signer = "3.0.1"
solana-system-interface = "3.2.0"
solana-transaction = "3.1.0"
tokio = { version = "1", features = ["full"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[patch.crates-io]
solana-invoke = { path = "vendor/solana-invoke" }
solana-keypair = { path = "vendor/solana-keypair" }
solana-program-test = { path = "vendor/solana-program-test" }
