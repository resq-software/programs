# OSV-Scanner config for the vendored solana-program-test lockfile.
#
# This file is picked up when osv-scanner scans the directory as its own
# project (it discovers Cargo.lock and looks for `osv-scanner.toml` in the
# same dir). Root-level config at the repo root does NOT propagate here —
# each lockfile is its own scan project.
#
# `solana-program-test` is a vendored copy of upstream Solana's test
# harness, consumed only as a dev-dependency from the workspace root.
# On-chain program bytecode ships none of this. Every advisory below is
# ignored with a reason; re-vendor from a newer Solana release to clear.
#
# Format: https://google.github.io/osv-scanner/configuration/
# Note: OSV-Scanner v2 expects PascalCase keys (IgnoredVulns); snake_case
# is rejected (checked against v2.3.5).

