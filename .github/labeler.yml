#
# actions/labeler config. Adapted from resq-software/npm's format
# (label -> changed-files -> any-glob-to-any-file). This is a Cargo/Anchor
# monorepo whose members are the two on-chain programs; pkg:* labels track
# each program dir, A-* track cross-cutting areas, C-* track categories.

# ── Program (package) scope labels ──────────────────────────────────────

"pkg:delivery":
  - changed-files:
    - any-glob-to-any-file: resq-delivery/**/*

"pkg:airspace":
  - changed-files:
    - any-glob-to-any-file: resq-airspace/**/*

# ── Area labels ─────────────────────────────────────────────────────────

"A-DevOps":
  - changed-files:
    - any-glob-to-any-file:
      - .github/workflows/**/*
      - .github/actions/**/*
      - .git-hooks/**/*

"A-Build":
  - changed-files:
    - any-glob-to-any-file:
      - Cargo.toml
      - Cargo.lock
      - Anchor.toml
      - "**/Cargo.toml"
      - Dockerfile
      - flake.nix
      - bootstrap.sh

"A-Vendor":
  - changed-files:
    - any-glob-to-any-file: vendor/**/*

"A-Scripts":
  - changed-files:
    - any-glob-to-any-file:
      - scripts/**/*
      - "**/*.sh"

# ── Category labels ─────────────────────────────────────────────────────

"C-Documentation":
  - changed-files:
    - any-glob-to-any-file:
      - "**/*.md"
      - docs/**/*

"C-Testing":
  - changed-files:
    - any-glob-to-any-file:
      - "**/tests/**/*"
      - scripts/test.sh

"C-Chore":
  - changed-files:
    - any-glob-to-any-file:
      - package.json
      - osv-scanner.toml
      - .gitignore
      - .gitattributes