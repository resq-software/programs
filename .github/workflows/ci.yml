#
# Thin CI wrapper. Dispatches to the org-wide reusable rust-ci workflow
# in resq-software/.github; the top-level `required` job aggregates the
# result into a single status-check context consumed by the org ruleset
# `default-branch-baseline`.
#
# Security scanning runs separately in security.yml.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    uses: resq-software/.github/.github/workflows/rust-ci.yml@40fa987f5bc78d7569b9b76274f24d032ac0d7c8
    with:
      toolchain: stable
      run-fmt: true
      run-clippy: true
      run-test: true
      run-deny: false
      run-coverage: false

  required:
    name: required
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted","linux","x64","zima"]') || 'ubuntu-latest' }}
    needs: [rust]
    if: always()
    steps:
      - name: Aggregate
        env:
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          set -eu
          case "$RUST_RESULT" in
            success|skipped|"") echo "ok: rust=$RUST_RESULT" ;;
            *) echo "::error::rust reusable returned: $RUST_RESULT"; exit 1 ;;
          esac

  # Publish a GitHub Release per v* tag so the org's changelog
  # aggregator picks the version up — the aggregator ingests GitHub *Releases*,
  # not git tags. Runs only on a tag push, after the `required` gate passes.
  #
  # What a release publishes is the tagged source, so the job also attaches an
  # SPDX JSON SBOM of it and a source archive with a fixed digest, and attests
  # build provenance for both. GitHub's own tag archives are generated on
  # demand, so their bytes are not a stable subject for an attestation.
  release:
    name: GitHub Release
    needs: [required]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted","linux","x64","zima"]') || 'ubuntu-latest' }}
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the provenance attestation through Sigstore
      attestations: write # store the attestation against this repository
    steps:
      # The tagged commit, for the SBOM and the source archive. Nothing here
      # pushes, so no credential is kept.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # The assets are generated and attested before the Release exists, so a
      # failure here publishes nothing.
      #
      # Generated before the archive exists, so it describes the checkout only.
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          # Uploaded to the Release below: the action's own release upload
          # only works on `release` events, and this job runs on a tag push.
          upload-artifact: false
          upload-release-assets: false

      - name: Archive the tagged source
        env:
          TAG: ${{ github.ref_name }}
        run: git archive --format=tar.gz --prefix="programs-$TAG/" -o "programs-$TAG-source.tar.gz" HEAD

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            programs-*-source.tar.gz
            sbom.spdx.json

      - name: Create GitHub Release from the tag
        # `gh` reads $GH_TOKEN and $GITHUB_REPOSITORY automatically; the tag is
        # passed via env (never `${{ }}` inside run:) to avoid zizmor template
        # injection. --generate-notes builds notes from merged PRs since the
        # previous tag; --verify-tag asserts the ref is a real tag first.
        # Skipped when the Release already exists, so a re-run after a failed
        # upload below can finish the job instead of failing here.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; attaching assets only"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi

      - name: Attach the source archive and SBOM to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # --clobber keeps a re-run idempotent.
        run: gh release upload "$TAG" "programs-$TAG-source.tar.gz" sbom.spdx.json --clobber
